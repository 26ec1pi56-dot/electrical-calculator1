<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Piyush Patidar">
<title>Electrical Parameter Calculator — Piyush Patidar</title>
<meta name="description" content="Calculate voltage, current, resistance and power with Ohm’s law and see the circuit respond live.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#0f3560; --paper2:#143f6f; --ink:#e6f0ff; --faint:#8fb0da; --line:#3d6aa3;
  --amber:#ffc857; --cyan:#7fdcff; --bad:#ff8f8f; --good:#8be3b0; --heat:#ff7b54;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); background:var(--paper);
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
header{margin-bottom:26px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.head-main{flex:1;min-width:280px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--faint);background:rgba(15,53,96,.7)}
h1{font:700 clamp(30px,5.2vw,54px)/1.08 Georgia,"Iowan Old Style","Times New Roman",serif;margin:14px 0 10px;letter-spacing:-.01em}
.lede{max-width:60ch;color:var(--faint);margin:0;font-size:17px}

/* Decorative animated header component icons */
.deco-icons{display:flex;gap:12px;align-items:center}
.deco-card{
  width:54px;height:54px;border-radius:8px;border:1px solid var(--line);
  background:rgba(10,38,70,.75);display:grid;place-items:center;
  animation:floatY 3.6s ease-in-out infinite;
}
.deco-card:nth-child(2){animation-delay:.6s}
.deco-card:nth-child(3){animation-delay:1.2s}
.deco-card svg{width:34px;height:34px}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.deco-pulse{animation:softPulse 2.2s ease-in-out infinite}
@keyframes softPulse{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.panel{background:rgba(10,38,70,.82);border:1px solid var(--line);border-radius:6px;padding:20px;backdrop-filter:blur(2px)}
h2{font:600 15px/1.3 system-ui,sans-serif;margin:0 0 12px;color:var(--faint);letter-spacing:.01em}
.tabs,.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button,.sub button,.chip{
  font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:4px;padding:8px 14px;cursor:pointer;min-height:40px;transition:background .15s,border-color .15s}
.tabs button:hover,.sub button:hover,.chip:hover{border-color:var(--cyan)}
.tabs button[aria-selected=true]{background:var(--amber);color:#1b2a40;border-color:var(--amber);font-weight:600}
.sub button[aria-pressed=true]{background:var(--cyan);color:#10304f;border-color:var(--cyan);font-weight:600}
.sub[hidden]{display:none}
.formula{font:600 26px/1.2 Georgia,serif;margin:6px 0 16px;color:var(--amber)}
.field{margin-bottom:14px}
label{display:block;font-size:14px;color:var(--faint);margin-bottom:5px}
.row{display:flex;gap:8px}
input,select{font:inherit;color:var(--ink);background:#0a2646;border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px}
input{flex:1;min-width:0;font-variant-numeric:tabular-nums}
select{width:92px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:6px}
.go{flex:1;font:600 16px system-ui;background:var(--amber);color:#1b2a40;border:0;border-radius:4px;padding:12px 16px;min-height:46px;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.reset{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 16px;cursor:pointer}
.err{margin-top:12px;border-left:3px solid var(--bad);padding:8px 12px;background:rgba(255,143,143,.1);color:#ffd0d0;border-radius:0 4px 4px 0}
.err[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;padding:6px 11px;min-height:34px;color:var(--faint)}
.result .label{color:var(--faint);font-size:14px}
.result .big{font:700 clamp(38px,7vw,64px)/1.05 Georgia,serif;color:var(--amber);font-variant-numeric:tabular-nums;word-break:break-word}
